[package]
name = "lampung-smart-waste-backend"
version = "1.0.0"
edition = "2021"
authors = ["Aura Azhar Naila", "Dr. Erliyan Redy Susanto, M.Kom"]
description = "REST API Backend untuk Sistem Smart City Pengelolaan Sampah Kota Bandar Lampung"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
argon2 = "0.5"
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = "0.3"

